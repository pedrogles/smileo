<h2 mat-dialog-title>
  Editar paciente
</h2>

<form
  [formGroup]="form"
  (ngSubmit)="onSubmit()"
>

  <mat-dialog-content>

    <div class="form-grid">

      <mat-form-field appearance="outline">
        <mat-label>Nome</mat-label>

        <input
          matInput
          formControlName="name"
        />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Telefone</mat-label>

        <input
          matInput
          formControlName="phone"
        />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>E-mail</mat-label>

        <input
          matInput
          formControlName="email"
        />
      </mat-form-field>

      <mat-checkbox formControlName="has_allergies">
        Possui alergias
      </mat-checkbox>

      <mat-form-field appearance="outline">
        <mat-label>
          Observações de alergias
        </mat-label>

        <textarea
          matInput
          rows="3"
          formControlName="allergies_notes"
        >
        </textarea>
      </mat-form-field>

      <mat-checkbox
        formControlName="has_medical_conditions"
      >
        Possui comorbidades
      </mat-checkbox>

      <mat-form-field appearance="outline">
        <mat-label>
          Observações médicas
        </mat-label>

        <textarea
          matInput
          rows="3"
          formControlName="medical_conditions_notes"
        >
        </textarea>
      </mat-form-field>

    </div>

  </mat-dialog-content>

  <mat-dialog-actions align="end">

    <button
      mat-button
      mat-dialog-close
      type="button"
    >
      Cancelar
    </button>

    <button
      mat-flat-button
      color="primary"
      type="submit"
    >
      Salvar
    </button>

  </mat-dialog-actions>

</form>
